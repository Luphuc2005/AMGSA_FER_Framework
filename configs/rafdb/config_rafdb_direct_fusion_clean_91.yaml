seed:
  random_seed: 42

source:
  note: "RAF-DB Clean Baseline + Direct Global-Regional Fusion: Built directly from 91% baseline (config_rafdb_convnext_base_ms1m_adaptive_siglip2_confusion.yaml). Adds Direct Global+Regional Fusion (1024-d), conservative LRs (head 1e-4, backbone 5e-6), soft hard semantic loss (lambda_hard=0.02, margin=0.10), strictly preserving baseline 91% augmentations, regularization (dropout=0.35, LS=0.10, WD=0.035), and natural RAF-DB train distribution."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 16
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: false

tta:
  enabled: true
  hflip: true
  original_weight: 0.40
  flip_weight: 0.60

data:
  data_path: "data/rafdb"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: false
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 12271
  cache: false
  sampling_strategy: null

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5
  gamma_min: 0.5
  gamma_max: 2.0
  random_erasing_prob: 0.40
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.15
  random_erasing_value: "random"

model:
  name: "rafdb_direct_fusion_clean_91"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001
  embed_dim: 512
  num_regions: 6
  num_heads: 4

  use_semantic_branch: true
  use_clip_semantic: true
  multi_prototype: true
  ablation: "adaptive_clip_confusion"

  # Dynamic Part-Aware Attention (Stage 3)
  use_dynamic_part_attention: true
  dynamic_part_bottleneck: 128
  use_soft_regional_pooling: false
  use_au_region_routed: true

  # Direct Global + Regional Fusion: S4 global (1024) + S3 (upper, AU, lower 512 each) -> 4x Dense(256) -> Concat(1024) -> Classifier
  use_global_regional_fusion: true
  global_regional_projection_dim: 256

  # Sample-Adaptive Logit Fusion Gate alpha(x)
  use_adaptive_fusion_gate: true
  adaptive_fusion_max_alpha: 0.20

  # Sample-adaptive granularity weighting across 5 prototypes
  use_adaptive_granularity: true

  # Confusion-Aware Hard Margin Semantic Loss
  use_hard_semantic_loss: true
  lambda_sem: 0.10
  lambda_hard: 0.02
  hard_margin: 0.10
  hard_pairs:
    0: [4, 2]     # angry -> sad, fear
    2: [4, 0]     # fear -> sad, angry
    4: [0, 2, 6]  # sad -> angry, fear, neutral
    6: [4]        # neutral -> sad

  clip_model_name: "google/siglip2-base-patch16-224"
  clip_embedding_dim: 768
  clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
  semantic_logit_scale: 20.0

  clip_semantic:
    enabled: true
    multi_prototype: true
    num_prototypes_per_class: 5
    clip_model_name: "google/siglip2-base-patch16-224"
    clip_embedding_dim: 768
    clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
    semantic_logit_scale: 20.0
    lambda_sem: 0.10
    lambda_hard: 0.02
    hard_margin: 0.10

  checkpoint_path: null
  checkpoint_strict: false
  classifier_dropout1: 0.35
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0

  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0

  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 80
  patience: 80
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.03
  sam_adaptive: false
  lr: 0.0001
  finetune_lr: 0.0001
  visual_extractor_lr: 0.000005
  weight_decay: 0.035
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  mode: "max"
  max_to_keep_acc: 5
  max_to_keep_loss: 5
  save_best_macro_f1: true
  max_to_keep_macro: 5
  resume: true
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100
  early_stop_on_overfit: false
  overfit_gap_threshold: 0.12
  overfit_gap_patience: 3
  unfreeze_drop_threshold: 0.04
  lambda_sem_schedule:
    enabled: false
    before_value: 0.10
    start_epoch: 5
    end_epoch: 10
    start_value: 0.10
    end_value: 0.10
    after_value: 0.10

paths:
  output_dir: "outputs/rafdb_direct_fusion_clean_91"
  logs_dir: "logs"
